spring:
  application:
    name: cotisapp-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cotisapp?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # Aligner avec Flyway (VARCHAR) — évite ENUM MySQL en validation
        type:
          preferred_enum_jdbc_type: STRING
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8084}
  servlet:
    context-path: /

cotisapp:
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
    max-file-size: ${UPLOAD_MAX_BYTES:10485760}
  jwt:
    secret: ${JWT_SECRET:ChangeMeToASecureSecretKeyAtLeast256BitsLongForProductionUse123456}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  totp:
    issuer: ${TOTP_ISSUER:CotisApp}
    encryption-key: ${TOTP_ENCRYPTION_KEY:${JWT_SECRET:ChangeMeToASecureSecretKeyAtLeast256BitsLongForProductionUse123456}}
    pending-token-ms: ${TOTP_PENDING_TOKEN_MS:300000}
  suivi-mensuel:
    cron: "0 0 1 1 * ?"

logging:
  level:
    com.cotisapp: INFO
    org.hibernate.SQL: WARN
